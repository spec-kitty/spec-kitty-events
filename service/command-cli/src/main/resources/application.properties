# Packaged defaults of command-cli, the write service (spec-kitty-events#156). Copied from the read service's hygiene where it applies.
# Loopback only, on a port the operating system picks: the service publishes the port in its endpoint file (LAUNCHER.md).
server.address=127.0.0.1
server.port=0
# No proxy trust: the Host/Origin filter reads the raw Host header, forwarded headers are refused.
server.forward-headers-strategy=none
spring.threads.virtual.enabled=true
# The service owns no static content and no error page of Boot's: every answer is a contract document or a Problem.
spring.web.resources.add-mappings=false
server.error.whitelabel.enabled=false
# No log line carries a path or a user name: Boot's startup line names the working directory and the user.
spring.main.log-startup-info=false
spring.main.banner-mode=off
# Tomcat's HTTP/1.1 parser and cookie parser log caller-controlled text at INFO; Spring's "No mapping" warning echoes the path.
logging.level.org.apache.coyote.http11=WARN
logging.level.org.apache.tomcat.util.http.parser.Cookie=WARN
logging.level.org.springframework.web.servlet.PageNotFound=ERROR
# server.shutdown is not set, so Boot's graceful web-server phase is off (the default is immediate); the drain is ServiceLifecycle's own and
# waits at most 5 s for the requests in flight, which is the real bound on a stalled request body. This 2 s is a defensive cap on any
# shutdown phase, in place of the 30 s default, so the process (and its lock) cannot outlive the launcher's 10 s stop budget.
spring.lifecycle.timeout-per-shutdown-phase=2s
