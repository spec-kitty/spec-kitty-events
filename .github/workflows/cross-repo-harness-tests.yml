# .github/workflows/cross-repo-harness-tests.yml
#
# Identity-Boundary CI Gate — spec-kitty-events repo
#
# Tracker: https://github.com/Priivacy-ai/spec-kitty/issues/1247
#
# Clones the e2e harness at a pinned SHA and runs the
# identity-boundary unit tests with the PR's HEAD copy of
# spec_kitty_events installed via `uv pip install -e`. If the PR
# breaks SaaS-side resolution assumptions, the unit suite turns red
# and merge is blocked.
#
# Pinned SHA: 193f5c0eb07c8fdb6943d91d205ab892b98d6dfc
# SHA-bump procedure: see README.md > "Identity-Boundary CI Gate".

name: cross-repo-harness-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: cross-repo-harness-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-repo-harness-tests:
    name: cross-repo-harness-tests
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout spec-kitty-events (PR head)
        uses: actions/checkout@v4
        with:
          path: events
          persist-credentials: false

      - name: Mint read-only access to the pinned harness repository
        id: harness-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.SK_CI_APP_ID }}
          private-key: ${{ secrets.SK_CI_APP_PRIVATE_KEY }}
          owner: spec-kitty
          repositories: EXPERIMENTAL-spec-kitty-end-to-end-testing
          permission-contents: read

      - name: Checkout spec-kitty-end-to-end-testing (pinned SHA)
        uses: actions/checkout@v4
        with:
          repository: spec-kitty/EXPERIMENTAL-spec-kitty-end-to-end-testing
          ref: 193f5c0eb07c8fdb6943d91d205ab892b98d6dfc
          path: e2e
          token: ${{ steps.harness-token.outputs.token }}
          persist-credentials: false

      # Fail closed before installs; the action post hook remains a cleanup fallback.
      - name: Revoke harness token before executing source code
        if: always() && steps.harness-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.harness-token.outputs.token }}
        run: gh api --method DELETE /installation/token

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install harness dependencies (frozen)
        working-directory: e2e
        run: uv sync --frozen

      - name: Override spec_kitty_events with PR head
        working-directory: e2e
        run: uv pip install -e ../events

      - name: Install spec-kitty CLI on PATH
        # The unit tests under tests/identity_boundary/unit/ instantiate
        # the canary harness which captures cli_version by shelling out
        # to the spec-kitty binary. The published 3.2.0rc22 metadata omits
        # click, so supply it explicitly to keep this required gate executable.
        run: |
          uv tool install --prerelease=allow --with click 'spec-kitty-cli==3.2.0rc22'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run identity-boundary unit tests
        working-directory: e2e
        run: uv run pytest tests/unit/identity_boundary/ tests/identity_boundary/unit/ -v

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: identity-boundary-failure-artifacts
          path: e2e/artifacts/sync_identity_boundary/
          if-no-files-found: ignore
