# .github/workflows/cross-repo-harness-tests.yml
#
# Identity-Boundary CI Gate — spec-kitty-events repo
#
# Tracker: https://github.com/Priivacy-ai/spec-kitty/issues/1247
#
# Clones the e2e harness at a pinned SHA and runs the
# identity-boundary unit tests with the PR's HEAD copy of
# spec_kitty_events installed via `uv pip install -e`. If the PR
# breaks SaaS-side resolution assumptions, the unit suite turns red
# and merge is blocked.
#
# Pinned SHA: 193f5c0eb07c8fdb6943d91d205ab892b98d6dfc
# SHA-bump procedure: see README.md > "Identity-Boundary CI Gate".
#
# Fork pull requests (#95, operator ruling Q1 option a): GitHub withholds repository
# secrets from `pull_request` runs whose head is a fork, so no App token can be minted
# and the harness cannot be cloned. On a fork PR the gate job is skipped by its `if:`,
# which GitHub reports as success for the required `cross-repo-harness-tests` check, and
# `fork-pr-harness-deferred` says so on the PR. The harness is not run on fork code here:
# after reviewing the diff (pushing it upstream gives it the secrets), a maintainer pushes
# the fork head unchanged to an upstream branch and runs the gate there before merge
# (docs/guides/contributing.md > "Pull requests from forks"); a push to main runs it again.
# No pull_request_target: no workflow hands a secret to fork code on its own.

name: cross-repo-harness-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: cross-repo-harness-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-repo-harness-tests:
    name: cross-repo-harness-tests
    # A PR labelled pr:pause-ci runs nothing (pr-pause-ci.yml), nor does a PR from a fork, which
    # has no secrets (#95; fork-pr-harness-deferred reports it). Every other event always runs.
    if: >-
      github.event_name != 'pull_request' ||
      (!contains(github.event.pull_request.labels.*.name, 'pr:pause-ci') &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout spec-kitty-events (PR head)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: events
          persist-credentials: false

      - name: Mint read-only access to the pinned harness repository
        id: harness-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.SK_CI_APP_ID }}
          private-key: ${{ secrets.SK_CI_APP_PRIVATE_KEY }}
          owner: spec-kitty
          repositories: EXPERIMENTAL-spec-kitty-end-to-end-testing
          permission-contents: read

      - name: Checkout spec-kitty-end-to-end-testing (pinned SHA)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: spec-kitty/EXPERIMENTAL-spec-kitty-end-to-end-testing
          ref: 193f5c0eb07c8fdb6943d91d205ab892b98d6dfc
          path: e2e
          token: ${{ steps.harness-token.outputs.token }}
          persist-credentials: false

      # Fail closed before installs; the action post hook remains a cleanup fallback.
      - name: Revoke harness token before executing source code
        if: always() && steps.harness-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.harness-token.outputs.token }}
        run: gh api --method DELETE /installation/token

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true

      - name: Install harness dependencies (frozen)
        working-directory: e2e
        run: uv sync --frozen

      - name: Override spec_kitty_events with PR head
        working-directory: e2e
        run: uv pip install -e ../events

      - name: Install spec-kitty CLI on PATH
        # The unit tests under tests/identity_boundary/unit/ instantiate
        # the canary harness which captures cli_version by shelling out
        # to the spec-kitty binary. The published 3.2.0rc22 metadata omits
        # click, so supply it explicitly to keep this required gate executable.
        run: |
          uv tool install --prerelease=allow --with click 'spec-kitty-cli==3.2.0rc22'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run identity-boundary unit tests
        working-directory: e2e
        run: uv run pytest tests/unit/identity_boundary/ tests/identity_boundary/unit/ -v

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: identity-boundary-failure-artifacts
          path: e2e/artifacts/sync_identity_boundary/
          if-no-files-found: ignore

  # Fork PRs only (#95): the gate above is skipped, which satisfies the required check, so this
  # job makes the deferral visible on the PR. It checks out nothing, runs no PR code, holds no
  # token permission and reads no secret; event values reach the script through env only.
  fork-pr-harness-deferred:
    name: cross-repo-harness-tests deferred (fork PR)
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'pr:pause-ci') &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Report that the harness runs on an upstream branch before merge
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          msg="Fork PR: the harness needs repository secrets GitHub withholds from forks, so it did not run here. A maintainer runs it on an upstream branch at this head before merge (docs/guides/contributing.md, Pull requests from forks)."
          echo "::notice title=cross-repo-harness-tests deferred::$msg"
          {
            echo "### cross-repo-harness-tests deferred (fork PR, #95)"
            echo
            printf 'Head %s from `%s`. %s\n' "$HEAD_SHA" "${HEAD_REPO:-a deleted fork}" "$msg"
          } >> "$GITHUB_STEP_SUMMARY"
