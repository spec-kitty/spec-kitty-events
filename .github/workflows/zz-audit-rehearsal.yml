# Throwaway pre-merge rehearsal for #239 (branch issue-239-token-spike only; never merged):
# runs the release-protection audit script from issue-239-release-protection with a contents: read token.
name: zz-audit-rehearsal
on:
  push:
    branches: [issue-239-token-spike]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: issue-239-release-protection
          persist-credentials: false
      - name: Audit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          start=$(date +%s)
          python3 scripts/release/release_protection_audit.py --repo "$REPO" \
            --expected scripts/release/release-protection-expected.json --summary "$GITHUB_STEP_SUMMARY"
          rc=$?
          echo "EXIT=$rc SECONDS=$(( $(date +%s) - start ))"
          df -h "$RUNNER_TEMP" | tail -1
          exit $rc
