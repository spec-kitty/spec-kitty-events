# Deterministic CI on Blacksmith — the same bin/ci-run.sh -> bin/ci-post.sh the exe CI VMs run, so the merge
# agent reads an identical `[ci] <verdict> @<sha>` comment. Governed by EXPERIMENTAL-spec-kitty-planning
# PROGRAM.md §2 and docs/BLACKSMITH-CI.md; exe stops dispatching this repo once it is listed in
# SK_CI_ACTIONS_REPOS (one producer per repo — never both).
name: ci

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha: { description: "40-char commit sha to run", required: true, type: string }
      pr: { description: "repo-local PR number (empty = main run)", required: false, default: "", type: string }

# one run per head; a newer push to the same PR supersedes the older run
concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.pr || 'main' }}
  cancel-in-progress: true

env:
  REPO: spec-kitty-events
  SK_HOME: ${{ github.workspace }}/work

jobs:
  suite:
    # same gate as bin/ci-dispatch.sh's priority producer: only squad-passed/exhausted heads (and main) get a run
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'squad:passed') ||
      contains(github.event.pull_request.labels.*.name, 'squad:exhausted')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    # planning#1876: the pre-suite workflow-integrity check (bin/ci-run.sh ->
    # check_workflow_integrity.py) reads live workflow registrations via gh api
    # using the Actions JOB token — the checker only remaps GITHUB_TOKEN ->
    # GH_TOKEN when GITHUB_TOKEN is present in its environment, so the job
    # token must be exported AND carry an explicit actions: read grant (the
    # default token set does not cover the Actions API — proven on spec-kitty
    # by dispatch runs 33874130455 / 33874487465). Kept as-is after
    # planning#1878: even though the App installation token now carries
    # Actions:read, the job-token path is the independent one this check keeps.
    permissions:
      actions: read
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # planning#1878: the CI credential is a short-lived (~1h) installation token of the
      # first-party GitHub App spec-kitty-factory-ci, minted per run — never the long-lived
      # SK_CI_TOKEN PAT, whose static org-wide scopes turned a missing Actions permission into
      # a 26h org-wide verdict outage (planning#1876). Org secrets SK_CI_APP_ID +
      # SK_CI_APP_PRIVATE_KEY must exist (owner step: create + org-wide install + key vaulting,
      # docs/BLACKSMITH-CI.md §One-time setup); until they do this lane posts no verdict and
      # the wiring PRs self-gate on it.
      - name: Require the CI App secrets (planning#1878)
        env:
          APP_ID: ${{ secrets.SK_CI_APP_ID }}
          APP_KEY: ${{ secrets.SK_CI_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::org secrets SK_CI_APP_ID and/or SK_CI_APP_PRIVATE_KEY are missing (GitHub App spec-kitty-factory-ci, installed org-wide and granted to spec-kitty/spec-kitty-events). Scope the App per the planning#1878 permission matrix — it includes Actions read/write and Contents write on the planning repo for the main-baseline refresh push — and see planning docs/BLACKSMITH-CI.md §One-time setup." ; exit 1
          fi
      - name: Mint the CI credential (App installation token, planning#1878)
        uses: actions/create-github-app-token@7bfa3a4717ef143a604ee0a99d859b8886a96d00 # v1.9.3
        id: mint
        with:
          app-id: ${{ secrets.SK_CI_APP_ID }}
          private-key: ${{ secrets.SK_CI_APP_PRIVATE_KEY }}
          # Squad MAJOR on zeitgeist#288: with neither `owner` nor `repositories` set the action
          # scopes the token to THIS repository only, and the planning clone + baseline push 403.
          # `owner` alone = every repo the org-wide installation reaches.
          owner: ${{ github.repository_owner }}
      # The initial token also serves mid-suite git/gh calls; it expires ~1h after mint, so a
      # suite running past the hour would start failing those calls before the re-mint. Current
      # runtime is well under that; documented bound only (zeitgeist#288 MINOR).
      - name: Export the CI credential
        env:
          TOKEN: ${{ steps.mint.outputs.token }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::App installation token mint returned empty (planning#1878)."; exit 1; }
          export GH_TOKEN="$TOKEN"
          # Force-remint pattern (planning#1878): the token is written for later steps only;
          # the post-verdict step re-mints, so a stale token is never served there.
          echo "GH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          # System-wide, not --global: the suites' clean-venv install tests run subprocesses with an isolated
          # HOME (pip pulling the private spec-kitty-events git dependency), so a per-user helper is invisible
          # to them. exe VMs get the same effect from /etc/gitconfig's insteadOf rewrite onto the proxy.
          sudo git config --system credential.helper '!gh auth git-credential'
          sudo git config --system user.name sk-agent; sudo git config --system user.email sk-agent@spec-kitty.ai
          gh auth setup-git
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
      - name: Resolve target
        id: t
        run: |
          case "${{ github.event_name }}" in
            pull_request) sha="${{ github.event.pull_request.head.sha }}"; pr="${{ github.event.pull_request.number }}" ;;
            push)         sha="${{ github.sha }}"; pr="" ;;
            *)            sha="${{ inputs.sha }}"; pr="${{ inputs.pr }}" ;;
          esac
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad sha '$sha'"; exit 64; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "pr=$pr" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v5
      - name: Sibling checkouts (planning + repo under test)
        run: |
          mkdir -p "$SK_HOME"
          git clone -q https://github.com/spec-kitty/EXPERIMENTAL-spec-kitty-planning.git "$SK_HOME/spec-kitty-planning"
          git clone -q https://github.com/spec-kitty/$REPO.git "$SK_HOME/$REPO"
          git -C "$SK_HOME/$REPO" fetch -q origin "${{ steps.t.outputs.sha }}"
      - name: Run the suite (bin/ci-run.sh --sync)
        working-directory: ${{ env.SK_HOME }}/spec-kitty-planning
        run: bin/ci-run.sh --sync "$REPO" "${{ steps.t.outputs.sha }}" "${{ steps.t.outputs.pr }}"
      - name: Re-mint the CI credential (force-remint, planning#1878)
        # Installation tokens live ~1h and the job timeout is 90 min — never serve
        # a stale token to the verdict post. Falls back to the initial mint when
        # the re-mint itself fails (a possibly-expired token beats no attempt).
        if: always() && steps.t.outcome == 'success'
        uses: actions/create-github-app-token@7bfa3a4717ef143a604ee0a99d859b8886a96d00 # v1.9.3
        id: remint
        continue-on-error: true  # the post step falls back to the initial mint (zeitgeist#288 MINOR)
        with:
          app-id: ${{ secrets.SK_CI_APP_ID }}
          private-key: ${{ secrets.SK_CI_APP_PRIVATE_KEY }}
          # Squad MAJOR on zeitgeist#288: with neither `owner` nor `repositories` set the action
          # scopes the token to THIS repository only, and the planning clone + baseline push 403.
          # `owner` alone = every repo the org-wide installation reaches.
          owner: ${{ github.repository_owner }}
      - name: Post the verdict (bin/ci-post.sh)
        if: always() && steps.t.outcome == 'success'
        working-directory: ${{ env.SK_HOME }}/spec-kitty-planning
        env:
          # The '!gh auth git-credential' helper reads GH_TOKEN at call time, so
          # the baseline git push picks the re-minted token up automatically.
          GH_TOKEN: ${{ steps.remint.outputs.token || steps.mint.outputs.token }}
        run: |
          run="$SK_HOME/ci-runs/$REPO/${{ steps.t.outputs.sha }}"
          [ -f "$run/exit" ] || { echo "::error::no run dir/exit file — suite never completed; not posting a verdict"; exit 1; }
          bin/ci-post.sh "$REPO" "${{ steps.t.outputs.sha }}" "$run" "${{ steps.t.outputs.pr }}"
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log-${{ steps.t.outputs.sha }}
          path: ${{ env.SK_HOME }}/ci-runs/**/log
          if-no-files-found: ignore
