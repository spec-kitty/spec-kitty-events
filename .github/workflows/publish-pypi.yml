name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  acceptance:
    uses: ./.github/workflows/acceptance.yml
    with:
      verification_profile: release

  build:
    needs: acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os
          import tomllib

          ref_name = os.environ["GITHUB_REF_NAME"]  # e.g. v0.5.0
          tag_version = ref_name[1:] if ref_name.startswith("v") else ref_name

          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)

          project_version = data["project"]["version"]
          if tag_version != project_version:
              raise SystemExit(
                  f"Tag/version mismatch: tag={tag_version}, pyproject={project_version}"
              )
          print(f"Tag/version validated: {tag_version}")
          PY

      # ADR 0005: the release PR folds docs/changelog/unreleased/ into CHANGELOG.md with
      # `scripts/changelog.py collect --version`. Refuse to publish while a fragment is
      # pending or the version has no `## [X.Y.Z]` section: the tag's version on a tag
      # push, pyproject's on a workflow_dispatch (which has no tag to read).
      - name: Validate the changelog is collected for the version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          fi
          python scripts/changelog.py release-check --version "$version"

      - name: Build distribution artifacts
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*

      - name: Validate distribution metadata
        run: python scripts/release/validate_distribution_metadata.py --package spec-kitty-events

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish package to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
