title: HealthStatus
description: >-
  ready accepts writes; draining finishes the writes it holds and refuses new ones with
  SERVICE_DRAINING (503, no Retry-After) before it exits. A service drains after a shutdown
  request or after its idle timeout (1800 s unless the launcher passes --idle-timeout).
type: string
enum:
  - ready
  - draining
