title: TransitionUnit
description: >-
  One work package transition: the transition row first, then its annotations, in order. The unit
  lands whole or not at all, in one write of full JSON lines that is synced before the answer.
  Every row names wpId as its wp_id, and a row that names a Mission names the missionId of the
  path; otherwise the request is REQUEST_MALFORMED. The service owns the row encoding and writes
  the bytes the CLI's one encoder writes (store.serialize_event_line, ADR 2026-10-22-1 D-7):
  sanitize_event_for_log first, which strips host and developer fields, then sorted keys. It never
  writes the bytes as received, and judges a retry by comparing sanitized rows as JSON values.
type: object
additionalProperties: false
required:
  - wpId
  - rows
  - context
properties:
  wpId:
    $ref: WpId.yaml
    description: The work package the unit moves.
  operation:
    $ref: WriteOperation.yaml
    description: The operation that produced the unit; absent means transition.
  rows:
    type: array
    minItems: 1
    items:
      $ref: EventRow.yaml
    description: The rows of the unit, the transition first.
    x-source:
      path: src/runtime/next/event_bridge.py
      symbol: WorkPackageTransition.rows
  context:
    $ref: RequestContext.yaml
    description: The request context of the unit.
    x-source:
      path: src/specify_cli/status/write_service_protocol.py
      symbol: TransitionUnit.context
  implementationEvidencePresent:
    type:
      - boolean
      - 'null'
    description: >-
      Whether implementation evidence exists, for the unforced in_progress -> for_review guard.
      Absent or null: the service infers it as core's pipeline does (any earlier transition of the
      work package). true or false: used verbatim. It never affects the subtask half of the guard,
      is ignored for other transitions and under force, and is never persisted (the appended bytes
      and replay are identical with and without it). An older service that does not know the field
      answers 400 REQUEST_MALFORMED (additionalProperties is false), so a client omits it unless
      the caller gave an explicit value (core #6195 documents the rolling upgrade).
    x-source:
      path: src/specify_cli/status/models.py
      symbol: TransitionRequest.implementation_evidence_present
examples:
  - $ref: ../examples/TransitionUnit.claim.yaml
  - $ref: ../examples/TransitionUnit.start-implementation.yaml
