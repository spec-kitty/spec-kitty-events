title: WriteSurface
description: >-
  Where the unit is written. checkout_append is a direct append in the repository root checkout,
  which holds the Mission directory; a lane worktree is never a status surface (core ADR
  2026-10-22-1 D-6 amendment, operator rulings of 2026-11-06 on spec-kitty/spec-kitty#7276).
  coordination_ref_commit is a commit of the appended event log straight onto the coordination
  branch named by destinationRef, built from git objects and published with a compare-and-swap
  update of that ref; no coordination worktree, index or working tree is read or written
  (ADR-0007). During the strangler the CLI resolves the surface and the service verifies it. The
  value checkout_append is this contract's name for the CLI's EventLogWriteTarget
  primary_checkout_append; coordination_ref_commit has no CLI target yet (the CLI's
  coordination_transaction_append, which it replaces, appends in a coordination worktree).
type: string
enum:
  - checkout_append
  - coordination_ref_commit
