title: RequestContext
description: >-
  Who asks, and where the CLI resolved the write to land (ADR 2026-10-22-1 D-3): the caller's
  checkout, the Mission directory (the write location) and, for coordination_ref_commit, the
  coordination branch whose tree holds it (ADR-0007). Paths are
  relative, use forward slashes and never contain a .. segment, a backslash or a drive letter; no
  host path travels. The service verifies the location against its own resolution and refuses
  with WRITE_LOCATION_UNVERIFIED when they differ.
type: object
additionalProperties: false
required:
  - actor
  - checkout
  - missionDirectory
  - writeSurface
  - destinationRef
if:
  required:
    - writeSurface
  properties:
    writeSurface:
      const: coordination_ref_commit
then:
  properties:
    destinationRef:
      type: string
      minLength: 1
      description: The coordination branch the service commits the unit onto; never null for coordination_ref_commit.
properties:
  actor:
    type: string
    minLength: 1
    description: The actor of the write, as the rows carry it.
    x-source:
      path: src/specify_cli/status/models.py
      symbol: StatusEvent.actor
  checkout:
    type: string
    minLength: 1
    pattern: '^(\.|(?!/)(?![A-Za-z]:)(?!.*\\)(?!(.*/)?\.\.(/|$)).+)$'
    description: >-
      The caller's checkout, relative to the repository root checkout: a single dot for the
      repository root checkout, otherwise the worktree's relative path. For checkout_append it is
      the checkout that holds the Mission directory, always the repository root checkout. For
      coordination_ref_commit it only names who asks: the write touches no checkout (ADR-0007).
    x-derived:
      rule: For checkout_append, the checkout the CLI resolved the write in (the repository root checkout, a single dot); for coordination_ref_commit, the caller's checkout, relative to the repository root checkout.
      inputs:
        - path: src/specify_cli/status/write_service_protocol.py
          symbol: transition_unit_from
  missionDirectory:
    type: string
    minLength: 1
    pattern: '^(\.|(?!/)(?![A-Za-z]:)(?!.*\\)(?!(.*/)?\.\.(/|$)).+)$'
    description: >-
      The Mission directory (the write location the CLI resolved). For checkout_append it is
      relative to the checkout; for coordination_ref_commit it is the path of the Mission
      directory in the tree of destinationRef, relative to the root of that tree.
    x-derived:
      rule: The port's write location, made relative to the checkout for checkout_append, or to the root of the tree of destinationRef for coordination_ref_commit.
      inputs:
        - path: src/runtime/next/event_bridge.py
          symbol: WorkPackageTransition.write_location
  writeSurface:
    $ref: WriteSurface.yaml
    description: The CLI write contract the location was resolved under.
  destinationRef:
    type:
      - string
      - 'null'
    description: >-
      The branch the unit's status commit lands on, when the CLI resolved one; null otherwise.
      Always set for coordination_ref_commit: it is the coordination branch whose ref the
      service moves.
    x-source:
      path: src/specify_cli/status/write_service_protocol.py
      symbol: RequestContext.destination_ref
