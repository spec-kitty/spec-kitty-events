# Informational SonarCloud analysis (#232), modelled on core's sonar-project.properties.
#
# Identity: the public `spec-kitty` SonarCloud organization, project
# `spec-kitty_spec-kitty-events`. The repository's `SONAR_TOKEN` secret authorizes
# analysis pushes to this project only, so these values must match it or the
# workflow's scan fails to upload. `.github/workflows/sonar.yml` runs the scan on a
# nightly schedule and by manual dispatch only; there is no `pull_request` trigger,
# so the analysis never gates a merge.
sonar.projectKey=spec-kitty_spec-kitty-events
sonar.organization=spec-kitty
sonar.projectName=spec-kitty-events

sonar.sourceEncoding=UTF-8
sonar.python.version=3.10

# Python package (`src/`), the JVM sources (the Java binding in `java/`, the
# events services in `service/`), and the contract documents/tooling in
# `contracts/`.
sonar.sources=src,contracts,service/src/main/java,service/domain-model/src/main/java,service/event-log/src/main/java,service/command-cli/src/main/java,java/src/main/java

# Test code, analysed as tests rather than as main code.
sonar.tests=tests,service/src/test/java,service/domain-model/src/test/java,service/event-log/src/test/java,service/command-cli/src/test/java,java/src/test/java

sonar.exclusions=**/build/**,**/node_modules/**,**/.venv/**,**/__pycache__/**,**/*.pyc

# `contracts/tools/` is not part of the scanned Python package's coverage figure:
# its checks run from the contract build, not from the package's pytest suite.
sonar.coverage.exclusions=contracts/tools/**,**/build/**

# Coverage is generated by .github/workflows/sonar.yml in the same job that scans,
# from the same checked-out revision (the workflow overrides these paths at scan
# time with the reports that exist). Coverage from another run or commit is never
# used; when a report is missing the scan runs without it and warns.
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.jacoco.xmlReportPaths=**/build/reports/jacoco/test/jacocoTestReport.xml
